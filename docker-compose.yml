# Infraestrutura de desenvolvimento do Chamados.
# Sobe: PostgreSQL 16, Redis 7 e MinIO. Todos com healthcheck e volume nomeado.
# Portas e credenciais vêm do .env (com defaults). Suba com: docker compose up -d
name: chamados

services:
  postgres:
    image: postgres:16-alpine
    container_name: chamados-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chamados}
      POSTGRES_USER: ${POSTGRES_USER:-chamados}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chamados}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-chamados} -d ${POSTGRES_DB:-chamados}']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: chamados-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  minio:
    image: minio/minio:latest
    container_name: chamados-minio
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'mc ready local || exit 1']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Mailpit: servidor SMTP + UI de inbox para DEV (M9 — specs/06). O worker envia
  # os e-mails reais (convite/reset, notificações de chamado) para o SMTP 1025 e a
  # caixa de entrada fica visível na UI. Não é usado em produção.
  mailpit:
    image: axllent/mailpit:latest
    container_name: chamados-mailpit
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 'true'
      MP_SMTP_AUTH_ALLOW_INSECURE: 'true'
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://localhost:8025/readyz']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # Provisiona o bucket único (prefixo por tenant — specs/07 §6.2). Roda uma vez
  # e sai; a aplicação também garante o bucket sob demanda (garantirBucket).
  minio-init:
    image: minio/mc:latest
    container_name: chamados-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local http://minio:9000
        "$${MINIO_ROOT_USER:-minioadmin}" "$${MINIO_ROOT_PASSWORD:-minioadmin}" &&
        mc mb --ignore-existing "local/$${STORAGE_BUCKET:-chamados}" &&
        echo "bucket $${STORAGE_BUCKET:-chamados} pronto"
    restart: 'no'

volumes:
  postgres-data:
    name: chamados-postgres-data
  redis-data:
    name: chamados-redis-data
  minio-data:
    name: chamados-minio-data
